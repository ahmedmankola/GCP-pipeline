apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: web-container
        # The SHORT_SHA tag is updated by your CI/CD pipeline
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 8080
